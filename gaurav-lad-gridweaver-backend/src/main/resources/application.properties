spring.application.name=gridweaver-backend

spring.datasource.url=jdbc:mysql://localhost:3306/gridweaver
spring.datasource.username=root
spring.datasource.password=Welcome&7
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#############################################
# Kafka
#############################################
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=gridweaver-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.gauravlad.gridweaver_backend.kafka.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.gauravlad.gridweaver_backend.kafka.event.TelemetryEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer